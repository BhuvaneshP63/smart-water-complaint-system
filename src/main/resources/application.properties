
spring.application.name=smart-water-complaint-system

# =====================================
# MySQL Database Configuration
# =====================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_water_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
app.jwt.secret=${JWT_SECRET}
app.admin.name=${ADMIN_NAME:SWCMS Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# =====================================
# JPA / Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =====================================
# Server Configuration
# =====================================
server.port=8080

# =====================================
# Image Upload Configuration
# =====================================

# Directory for storing uploaded images
app.upload.dir=uploads

# Maximum size of a single uploaded file
spring.servlet.multipart.max-file-size=5MB

# Maximum size of the complete request
spring.servlet.multipart.max-request-size=10MB
